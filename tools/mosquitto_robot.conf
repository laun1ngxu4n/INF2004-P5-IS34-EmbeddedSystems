# Broker for the robot on a private phone hotspot only.
# Port 1884: the Mosquitto Windows service already holds 1883 but only
# for this laptop (localhost), so the robot cannot reach it there.
# Run:  "C:\Program Files\mosquitto\mosquitto.exe" -c tools/mosquitto_robot.conf -v
# (or the "Start broker" button in tools/is34_panel.py)
# Windows: allow mosquitto.exe through the firewall.
listener 1884 0.0.0.0
allow_anonymous true
